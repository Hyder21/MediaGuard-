name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle manually
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH
      - name: Create project files
        run: |
          python3 << 'PY'
          import pathlib
          pathlib.Path("app/src/main/java/com/mediaguard").mkdir(parents=True, exist_ok=True)
          open("build.gradle","w").write("plugins { id 'com.android.application' version '8.2.0' apply false }\n")
          open("settings.gradle","w").write('include ":app"\n')
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2g\n")
          open("app/build.gradle","w").write("""
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mediaguard'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mediaguard'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          """)
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="MediaGuard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/java/com/mediaguard/MainActivity.java","w").write('package com.mediaguard; import android.os.Bundle; import androidx.appcompat.app.AppCompatActivity; import android.widget.TextView; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); TextView tv=new TextView(this); tv.setText("MediaGuard Active"); setContentView(tv);} }')
          PY
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGuard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
