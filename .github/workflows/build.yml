name: Build MediaGuard Pro v12 COMPLETE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.2

      - name: Create MediaGuard Pro v12 - REAL UI
        run: |
          rm -rf app build .gradle gradle gradlew
          mkdir -p app/src/main/java/com/mediaguard app/src/main/res/values app/src/main/res/drawable
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          EOF
          
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig { applicationId "com.mediaguard"; minSdk 26; targetSdk 34; versionCode 12; versionName "12.0-REAL" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            packaging { resources { excludes += "/META-INF/*" } }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
            <style name="Theme.MediaGuard" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorPrimary">#1976D2</item>
              <item name="colorPrimaryDark">#0D47A1</item>
            </style>
          </resources>
          EOF
          
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">MediaGuard Pro</string></resources>
          EOF
          
          cat > app/src/main/res/drawable/shield.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1976D2" android:pathData="M54,10 L20,26 L20,60 C20,80 35,95 54,100 C73,95 88,80 88,60 L88,26 Z"/></vector>
          EOF
          
          cat > app/src/main/res/drawable/card_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1E1E1E"/><corners android:radius="16dp"/>
