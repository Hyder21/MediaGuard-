name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create Full App - All Libs
        run: |
          mkdir -p app/src/main/java/com/mediaguard app/src/main/res/values app/src/main/res/drawable
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat > settings.gradle <<'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          SET
          cat > build.gradle <<'BLD'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          BLD
          cat > gradle.properties <<'PROP'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          PROP
          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig { applicationId "com.mediaguard"; minSdk 26; targetSdk 34; versionCode 80; versionName "10.0-MAIN-FIXED" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          APP
          cat > app/src/main/res/values/themes.xml <<'TH'
          <resources><style name="Theme.MediaGuard" parent="Theme.Material3.DayNight"><item name="colorPrimary">#1976D2</item></style></resources>
          TH
          cat > app/src/main/res/drawable/shield.xml <<'SH'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1976D2" android:pathData="M54,10 L20,26 L20,60 C20,80 35,95 54,100 C73,95 88,80 88,60 L88,26 Z"/></vector>
          SH
          cat > app/src/main/AndroidManifest.xml <<'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="MediaGuard" android:theme="@style/Theme.MediaGuard" android:icon="@drawable/shield">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          MAN
          cat > app/src/main/java/com/mediaguard/MainActivity.java <<'JAVA'
          package com.mediaguard;
          import android.os.Bundle; import android.widget.*; import android.graphics.Color;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){ super.onCreate(b);
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setBackgroundColor(Color.parseColor("#121212")); root.setPadding(30,100,30,30);
              TextView tv=new TextView(this); tv.setText("MAIN v10.0 FIXED\nAll libs: barcode 17.2.0 + text 16.0.0 + material + appcompat\nIf build = 90s and green, main is fixed\nBranches can now separate"); tv.setTextColor(Color.WHITE); tv.setTextSize(18); root.addView(tv); setContentView(root);
            }
          }
          JAVA

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGuard-v10-MAIN-FIXED
          path: app/build/outputs/apk/debug/app-debug.apk
