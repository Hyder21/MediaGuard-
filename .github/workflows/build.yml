name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create App
        run: |
          mkdir -p app/src/main/java/com/mediaguard
          cat > settings.gradle <<'S'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          S
          cat > build.gradle <<'S'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          S
          cat > gradle.properties <<'S'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          S
          cat > app/build.gradle <<'S'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig { applicationId "com.mediaguard"; minSdk 24; targetSdk 34; versionCode 7; versionName "2.1-fixed" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
          }
          S
          cat > app/src/main/AndroidManifest.xml <<'S'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <application android:allowBackup="true" android:label="MediaGuard" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          S
          cat > app/src/main/java/com/mediaguard/MainActivity.java <<'S'
          package com.mediaguard;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.widget.TextView;
          import android.widget.ScrollView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.google.mlkit.vision.barcode.BarcodeScanning;
          import com.google.mlkit.vision.common.InputImage;
          public class MainActivity extends AppCompatActivity {
              TextView log;
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  log = new TextView(this);
                  log.setTextSize(14);
                  log.setPadding(30,50,30,30);
                  log.setText("MediaGuard v2.1\n\nStarting...\n");
                  ScrollView sv = new ScrollView(this);
                  sv.addView(log);
                  setContentView(sv);
                  checkPerm();
              }
              void checkPerm() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                      log.append("Requesting permission...\n");
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO}, 101);
                  } else { startScan(); }
              }
              public void onRequestPermissionsResult(int c, String[] p, int[] r) { startScan(); }
              void startScan() {
                  log.append("Permission OK\nScanning last 5 images for QR codes...\n\n");
                  try {
                      Cursor cur = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, new String[]{"_id"}, null, null, "date_added DESC");
                      if (cur != null) {
                          int n=0;
                          while (cur.moveToNext() && n < 5) {
                              long id = cur.getLong(0);
                              Uri u = Uri.withAppendedPath(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, String.valueOf(id));
                              doScan(u);
                              n++;
                          }
                          cur.close();
                          log.append("\nScanned "+n+" images. Done.\nIf image has QR, it will appear above.\n");
                      } else { log.append("No gallery access or empty.\n"); }
                  } catch (Exception e) { log.append("Error: "+e.getMessage()+"\n"); }
              }
              void doScan(Uri uri) {
                  try {
                      InputImage img = InputImage.fromFilePath(this, uri);
                      BarcodeScanning.getClient().process(img).addOnSuccessListener(list -> {
                          for (com.google.mlkit.vision.barcode.common.Barcode bc : list) {
                              log.append(">> QR FOUND: " + bc.getRawValue() + "\n");
                          }
                      });
                  } catch (Exception ignored) {}
              }
          }
          S

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
          arguments: assembleDebug --stacktrace
          cache-disabled: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGuard-v2.1-FIXED
          path: app/build/outputs/apk/debug/app-debug.apk
