name: ONE APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon
      - name: Make Tag
        id: t
        run: echo "TAG=v11-$(date +%H%M)" >> $GITHUB_OUTPUT
      - name: Release One APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.t.outputs.TAG }}
          name: MediaGuard ${{ steps.t.outputs.TAG }}
          files: app/build/outputs/apk/debug/app-debug.apk
