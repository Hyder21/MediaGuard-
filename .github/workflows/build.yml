name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create App
        run: |
          mkdir -p app/src/main/java/com/mediaguard
          echo "pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}} dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}} include ':app'" > settings.gradle
          echo "plugins{id 'com.android.application' version '8.2.0' apply false}" > build.gradle
          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties
          printf "plugins{id 'com.android.application'}\nandroid{namespace 'com.mediaguard';compileSdk 34;defaultConfig{applicationId 'com.mediaguard';minSdk 24;targetSdk 34;versionCode 3;versionName '2.0'}}\ndependencies{implementation 'androidx.appcompat:appcompat:1.6.1';implementation 'com.google.mlkit:barcode-scanning:17.2.0'}\n" > app/build.gradle
          echo '<?xml version="1.0"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><application android:label="MediaGuard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf "package com.mediaguard; import android.Manifest; import android.content.pm.PackageManager; import android.database.Cursor; import android.net.Uri; import android.os.Bundle; import android.provider.MediaStore; import android.widget.TextView; import androidx.appcompat.app.AppCompatActivity; import androidx.core.content.ContextCompat; import androidx.core.app.ActivityCompat; import com.google.mlkit.vision.barcode.BarcodeScanning; import com.google.mlkit.vision.common.InputImage; public class MainActivity extends AppCompatActivity{TextView log; protected void onCreate(Bundle b){super.onCreate(b);log=new TextView(this);setContentView(log);check();} void check(){String[] p={Manifest.permission.READ_MEDIA_IMAGES,Manifest.permission.READ_MEDIA_VIDEO}; boolean n=false; for(String s:p) if(ContextCompat.checkSelfPermission(this,s)!=0) n=true; if(n) ActivityCompat.requestPermissions(this,p,101); else scan();} public void onRequestPermissionsResult(int c,String[] p,int[] r){scan();} void scan(){log.setText(\"Scanning incoming media for QR...\\n\"); try{Cursor cur=getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,new String[]{\"_id\"},null,null,\"date_added DESC LIMIT 5\"); if(cur!=null){while(cur.moveToNext()){Uri u=Uri.withAppendedPath(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,\"\"+cur.getLong(0)); try{InputImage img=InputImage.fromFilePath(this,u); BarcodeScanning.getClient().process(img).addOnSuccessListener(bs->{for(com.google.mlkit.vision.barcode.common.Barcode bc:bs){log.append(\"QR: \"+bc.getRawValue()+\"\\n\");}});}catch(Exception e){}} cur.close();}}catch(Exception e){log.setText(e.toString());}}}" > app/src/main/java/com/mediaguard/MainActivity.java
      - name: Build
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2
          arguments: assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MediaGuard-v2
          path: app/build/outputs/apk/debug/app-debug.apk
