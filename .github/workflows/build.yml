name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create App
        run: |
          mkdir -p app/src/main/java/com/mediaguard
          cat > settings.gradle <<'S'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          S
          cat > build.gradle <<'S'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          S
          cat > gradle.properties <<'S'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          S
          cat > app/build.gradle <<'S'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig { applicationId "com.mediaguard"; minSdk 26; targetSdk 34; versionCode 42; versionName "7.2-CrashFix" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          S
          cat > app/src/main/AndroidManifest.xml <<'S'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:label="MediaGuard" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
                  <service android:name=".GuardService" android:foregroundServiceType="dataSync"/>
                  <service android:name=".FirewallVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service>
              </application>
          </manifest>
          S
          cat > app/src/main/java/com/mediaguard/GuardService.java <<'S'
          package com.mediaguard;
          import android.app.*;
          import android.content.Intent;
          import android.os.IBinder;
          public class GuardService extends Service {
              public IBinder onBind(Intent i){return null;}
              public int onStartCommand(Intent intent,int flags,int startId){
                  NotificationChannel ch=new NotificationChannel("guard","Protection",NotificationManager.IMPORTANCE_LOW);
                  ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  Notification noti=new Notification.Builder(this,"guard").setSmallIcon(android.R.drawable.ic_dialog_alert).setContentTitle("MediaGuard Firewall").setContentText("Blocking nmap").setOngoing(true).build();
                  startForeground(1,noti); return START_STICKY;
              }
          }
          S
          cat > app/src/main/java/com/mediaguard/FirewallVpnService.java <<'S'
          package com.mediaguard;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;
          public class FirewallVpnService extends VpnService {
              ParcelFileDescriptor vpn=null;
              public int onStartCommand(Intent intent,int flags,int startId){
                  try{ vpn=new Builder().addAddress("10.0.0.2",32).addRoute("0.0.0.0",0).setSession("MediaGuard").establish(); }catch(Exception e){}
                  return START_STICKY;
              }
              public void onDestroy(){ try{if(vpn!=null) vpn.close();}catch(Exception e){} super.onDestroy(); }
          }
          S
          cat > app/src/main/java/com/mediaguard/MainActivity.java <<'S'
