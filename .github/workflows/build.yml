name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create REAL MediaGuard App
        run: |
          mkdir -p app/src/main/java/com/mediaguard
          
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          EOF
          
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig {
              applicationId "com.mediaguard"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "2.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="MediaGuard" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mediaguard/MainActivity.java <<'EOF'
          package com.mediaguard;
          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.pm.PackageManager;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.MediaStore;
          import android.widget.TextView;
          import android.widget.ScrollView;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.google.mlkit.vision.barcode.BarcodeScanner;
          import com.google.mlkit.vision.barcode.BarcodeScanning;
          import com.google.mlkit.vision.barcode.common.Barcode;
          import com.google.mlkit.vision.common.InputImage;
          import java.io.IOException;

          public class MainActivity extends AppCompatActivity {
              private TextView logView;
              private BarcodeScanner scanner;
              private static final int REQ = 101;
              
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  scanner = BarcodeScanning.getClient();
                  
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30,30,30,30);
                  
                  TextView title = new TextView(this);
                  title.setText("MediaGuard v2.0\nAuto-scanning incoming media + QR");
                  title.setTextSize(18);
                  layout.addView(title);
                  
                  logView = new TextView(this);
                  logView.setText("\nWaiting for permissions...\n");
                  ScrollView sv = new ScrollView(this);
                  sv.addView(logView);
                  layout.addView(sv);
                  setContentView(layout);
                  
                  checkPerms();
              }
              
              void checkPerms() {
                  String[] perms = {Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.CAMERA};
                  boolean need = false;
                  for(String p: perms) if(ContextCompat.checkSelfPermission(this,p)!=PackageManager.PERMISSION_GRANTED) need=true;
                  if(need) ActivityCompat.requestPermissions(this, perms, REQ);
                  else startScanning();
              }
              
              @Override
              public void onRequestPermissionsResult(int c, String[] p, int[] r) {
                  super.onRequestPermissionsResult(c,p,r);
                  startScanning();
              }
              
              void startScanning() {
                  log("Permissions granted.\nStarting media observer...\n");
                  // Observe new media
                  getContentResolver().registerContentObserver(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, new ContentObserver(new Handler()) {
                      @Override
                      public void onChange(boolean self) {
                          scanLatestImage();
                      }
                  });
                  getContentResolver().registerContentObserver(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, true, new ContentObserver(new Handler()) {
                      @Override
                      public void onChange(boolean self) {
                          log("New video detected!\n");
                      }
                  });
                  scanLatestImage();
                  log("Listening for WhatsApp, Telegram, etc media...\nAny image saved will be scanned for QR codes automatically