name: Build Android APK - MAIN FIXED
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK installed"

      - name: Create App - FULL STACK ALL LIBS
        run: |
          mkdir -p app/src/main/java/com/mediaguard app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.mediaguard'
            compileSdk 34
            defaultConfig { applicationId "com.mediaguard"; minSdk 26; targetSdk 34; versionCode 71; versionName "9.2-MAIN-FIXED" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.google.mlkit:barcode-scanning:17.2.0'
            implementation 'com.google.mlkit:text-recognition:16.0.0'
          }
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.MediaGuard" parent="Theme.Material3.DayNight"><item name="colorPrimary">#1976D2</item></style></resources>
          EOF
          cat > app/src/main/res/drawable/shield.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#1976D2" android:pathData="M54,10 L20,26 L20,60 C20,80 35,95 54,100 C73,95 88,80 88,60 L88,26 Z"/></vector>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="MediaGuard" android:theme="@style/Theme.MediaGuard" android:icon="@drawable/shield">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".GuardService"/><service android:name=".FirewallVpnService" android:permission="android.permission.BIND_VPN_SERVICE"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/mediaguard/GuardService.java <<'EOF'
          package com.mediaguard; import android.app.*; import android.content.Intent; import android.os.IBinder; import androidx.core.app.NotificationCompat;
          public class GuardService extends Service { public IBinder onBind(Intent i){return null;} public int onStartCommand(Intent intent,int f,int s){ NotificationChannel ch=new NotificationChannel("g","g",NotificationManager.IMPORTANCE_LOW); ((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch); Notification n=new NotificationCompat.Builder(this,"g").setSmallIcon(R.drawable.shield).setContentTitle("MediaGuard").build(); startForeground(1,n); return START_STICKY; } }
          EOF
          cat > app/src/main/java/com/mediaguard/FirewallVpnService.java <<'EOF'
          package com.mediaguard; import android.content.Intent; import android.net.VpnService; import android.os.ParcelFileDescriptor;
          public class FirewallVpnService extends VpnService { ParcelFileDescriptor p; public int onStartCommand(Intent i,int f,int s){ try{p=new Builder().addAddress("10.0.0.2",32).addRoute("0.0.0.0",0).establish();}catch(Exception e){} return START_STICKY; } }
          EOF
          cat > app/src/main/java/com/mediaguard/MainActivity.java <<'EOF'
          package com.mediaguard;
          import android.os.Bundle; import android.widget.*; import android.graphics.Color; import android.os.Handler; import java.text.SimpleDateFormat; import java.util.*;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b){ super.onCreate(b);
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setBackgroundColor(Color.parseColor("#121212")); root.setPadding(20,100,20,20);
              TextView tv=new TextView(this); tv.setText("MAIN FIXED v9.2\nAll libs running\nBuild with SDK setup\nDate: "+new SimpleDateFormat("HH:mm:ss").format(new Date())+"\n\nBranches separated:\n- main = stable\n- dev = testing\n- feature/* = separate"); tv.setTextColor(Color.WHITE); tv.setTextSize(16); root.addView(tv); setContentView(root);
            }
          }
          EOF

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaGuard-MAIN-FIXED-v9.2
          path: app/build/outputs/apk/debug/app-debug.apk
